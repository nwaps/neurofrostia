name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to deploy'
        required: true
        type: choice
        options: [corelife, moralityengine, all]

jobs:
  confirm-branch:
    runs-on: [self-hosted, prod]
    steps:
      - name: Confirm running on main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "This workflow must be triggered from main."
            exit 1
          fi

  build-corelife:
    needs: confirm-branch
    runs-on: [self-hosted, prod]
    if: ${{ inputs.plugin == 'corelife' || inputs.plugin == 'all' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Parent POM
        run: mvn -f plugins/pom.xml install -N --batch-mode

      - name: Test & Install CoreLife
        run: mvn -f plugins/corelife/pom.xml install --batch-mode

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: corelife-${{ github.sha }}
          path: plugins/corelife/target/*.jar
          if-no-files-found: error

  build-moralityengine:
    needs: build-corelife
    runs-on: [self-hosted, prod]
    if: ${{ inputs.plugin == 'moralityengine' || inputs.plugin == 'all' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Parent POM
        run: mvn -f plugins/pom.xml install -N --batch-mode

      - name: Install CoreLife
        run: mvn -f plugins/corelife/pom.xml install -DskipTests --batch-mode

      - name: Test & Build MoralityEngine
        run: mvn -f plugins/moralityengine/pom.xml install --batch-mode

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moralityengine-${{ github.sha }}
          path: plugins/moralityengine/target/*.jar
          if-no-files-found: error

  deploy:
    needs: [build-corelife, build-moralityengine]
    runs-on: [self-hosted, prod]
    if: always() && !failure() && !cancelled()

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ github.sha }}"
          path: artifacts
          merge-multiple: false

      - name: Check and Fix Permissions
        run: |
          PLUGINS_DIR="/var/opt/minecraft/crafty/crafty-4/servers/${{ secrets.PROD_CRAFTY_SERVER_GUID }}/plugins"

          if [ ! -d "$PLUGINS_DIR" ]; then
            echo "❌ Plugins directory does not exist: $PLUGINS_DIR"
            exit 1
          fi

          if [ ! -w "$PLUGINS_DIR" ]; then
            echo "🔧 Fixing write permission on plugins directory: $PLUGINS_DIR"
            sudo chmod g+w "$PLUGINS_DIR"
            if [ ! -w "$PLUGINS_DIR" ]; then
              echo "❌ Could not fix write permission on $PLUGINS_DIR"
              exit 1
            fi
          fi

          if [ ! -x "$PLUGINS_DIR" ]; then
            echo "🔧 Fixing execute permission on plugins directory: $PLUGINS_DIR"
            sudo chmod g+x "$PLUGINS_DIR"
            if [ ! -x "$PLUGINS_DIR" ]; then
              echo "❌ Could not fix execute permission on $PLUGINS_DIR"
              exit 1
            fi
          fi

          sudo chmod g+s "$PLUGINS_DIR"

          echo "✅ Plugins directory permissions OK"

      - name: Backup and Deploy
        run: |
          PLUGINS_DIR="/var/opt/minecraft/crafty/crafty-4/servers/${{ secrets.PROD_CRAFTY_SERVER_GUID }}/plugins"
          BACKUP_DIR="${PLUGINS_DIR}/backups/$(date +%Y%m%d%H%M%S)"
          mkdir -p "$BACKUP_DIR"
          for ARTIFACT_DIR in artifacts/*/; do
            PLUGIN=$(basename "$ARTIFACT_DIR" "-${{ github.sha }}")
            EXISTING=$(find "${PLUGINS_DIR}" -maxdepth 1 -iname "${PLUGIN}*.jar" | head -n1)
            if [ -n "$EXISTING" ]; then
              mv "$EXISTING" "$BACKUP_DIR/"
            fi
            cp "$ARTIFACT_DIR"*.jar "${PLUGINS_DIR}/"
          done

      - name: Restart Server
        run: |
          curl -sf -X POST "https://localhost:8443/api/v2/servers/${{ secrets.PROD_CRAFTY_SERVER_GUID }}/action/restart_server" \
            -H "Authorization: Bearer ${{ secrets.PROD_CRAFTY_TOKEN }}" \
            -k

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          ICON=$([ "${{ job.status }}" = "success" ] && echo "🚀" || echo "❌")
          MSG="${ICON} **PROD** — \`${{ inputs.plugin }}\` | ${{ github.actor }} | [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
          jq -n --arg content "$MSG" '{"content": $content}' | \
            curl -X POST "${DISCORD_WEBHOOK}" \
            -H "Content-Type: application/json" -d @-