name: Deploy to Dev

on:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: [self-hosted, dev]
    strategy:
      matrix:
        plugin: [corelife, moralityengine]

    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: mvn -f plugins/${{ matrix.plugin }}/pom.xml test --batch-mode

      - name: Build
        run: mvn -f plugins/${{ matrix.plugin }}/pom.xml package -DskipTests --batch-mode

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-${{ github.sha }}
          path: plugins/${{ matrix.plugin }}/target/*.jar
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: [self-hosted, dev]

    steps:
      - name: Download corelife
        uses: actions/download-artifact@v4
        with:
          name: corelife-${{ github.sha }}
          path: artifacts/corelife

      - name: Download moralityengine
        uses: actions/download-artifact@v4
        with:
          name: moralityengine-${{ github.sha }}
          path: artifacts/moralityengine

      - name: Backup and Deploy
        run: |
          PLUGINS_DIR="/var/opt/minecraft/crafty/crafty-4/servers/${{ secrets.DEV_CRAFTY_SERVER_GUID }}/plugins"
          BACKUP_DIR="${PLUGINS_DIR}/backups/$(date +%Y%m%d%H%M%S)"
          mkdir -p "$BACKUP_DIR"
          for PLUGIN in corelife moralityengine; do
            EXISTING=$(ls "${PLUGINS_DIR}/${PLUGIN}"*.jar 2>/dev/null | head -n1)
            if [ -n "$EXISTING" ]; then
              mv "$EXISTING" "$BACKUP_DIR/"
            fi
            cp "artifacts/${PLUGIN}/"*.jar "${PLUGINS_DIR}/"
          done

      - name: Restart Server
        run: |
          curl -sf -X POST "https://localhost:8443/api/v2/servers/${{ secrets.DEV_CRAFTY_SERVER_GUID }}/action/restart_server" \
            -H "Authorization: Bearer ${{ secrets.DEV_CRAFTY_TOKEN }}" \
            -k

      - name: Notify Discord
        if: always()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          ICON=$([ "${{ job.status }}" = "success" ] && echo "✅" || echo "❌")
          MSG="${ICON} **DEV** — \`all plugins\` | ${{ github.actor }} | [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) — ${COMMIT_MSG}"
          jq -n --arg content "$MSG" '{"content": $content}' | \
            curl -X POST "${DISCORD_WEBHOOK}" \
            -H "Content-Type: application/json" -d @-