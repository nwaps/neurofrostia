name: Deploy to Dev

on:
  push:
    branches: [dev]

jobs:
  build-corelife:
    runs-on: [self-hosted, dev]

    steps:
      - uses: actions/checkout@v4

      - name: Install Parent POM
        run: mvn -f plugins/pom.xml install -N --batch-mode

      - name: Test & Install CoreLife
        run: mvn -f plugins/corelife/pom.xml install --batch-mode

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: corelife-${{ github.sha }}
          path: plugins/corelife/target/*.jar
          if-no-files-found: error

      - name: Upload Config Artifact
        uses: actions/upload-artifact@v4
        with:
          name: corelife-config-${{ github.sha }}
          path: plugins/corelife/src/main/resources/config.yml
          if-no-files-found: error

  build-moralityengine:
    needs: build-corelife
    runs-on: [self-hosted, dev]

    steps:
      - uses: actions/checkout@v4

      - name: Install Parent POM
        run: mvn -f plugins/pom.xml install -N --batch-mode

      - name: Install CoreLife
        run: mvn -f plugins/corelife/pom.xml install -DskipTests --batch-mode

      - name: Test & Build MoralityEngine
        run: mvn -f plugins/moralityengine/pom.xml install --batch-mode

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moralityengine-${{ github.sha }}
          path: plugins/moralityengine/target/*.jar
          if-no-files-found: error

      - name: Upload Config Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moralityengine-config-${{ github.sha }}
          path: plugins/moralityengine/src/main/resources/config.yml
          if-no-files-found: error

  deploy:
    needs: [build-corelife, build-moralityengine]
    runs-on: [self-hosted, dev]

    steps:
      - name: Download corelife JAR
        uses: actions/download-artifact@v4
        with:
          name: corelife-${{ github.sha }}
          path: artifacts/corelife

      - name: Download moralityengine JAR
        uses: actions/download-artifact@v4
        with:
          name: moralityengine-${{ github.sha }}
          path: artifacts/moralityengine

      - name: Download corelife config
        uses: actions/download-artifact@v4
        with:
          name: corelife-config-${{ github.sha }}
          path: artifacts/corelife-config

      - name: Download moralityengine config
        uses: actions/download-artifact@v4
        with:
          name: moralityengine-config-${{ github.sha }}
          path: artifacts/moralityengine-config

      - name: Check and Fix Permissions
        run: |
          PLUGINS_DIR="/var/opt/minecraft/crafty/crafty-4/servers/${{ secrets.DEV_CRAFTY_SERVER_GUID }}/plugins"
          declare -A CONFIG_DIRS=(
            [corelife]="CoreLife"
            [moralityengine]="MoralityEngine"
          )

          # Check plugins root exists
          if [ ! -d "$PLUGINS_DIR" ]; then
            echo "❌ Plugins directory does not exist: $PLUGINS_DIR"
            exit 1
          fi

          # Fix plugins root write permission
          if [ ! -w "$PLUGINS_DIR" ]; then
            echo "🔧 Fixing write permission on plugins directory: $PLUGINS_DIR"
            chmod g+w "$PLUGINS_DIR"
            if [ ! -w "$PLUGINS_DIR" ]; then
              echo "❌ Could not fix write permission on $PLUGINS_DIR — try: sudo chmod g+w $PLUGINS_DIR && sudo chmod g+s $PLUGINS_DIR"
              exit 1
            fi
          fi

          # Fix plugins root execute permission
          if [ ! -x "$PLUGINS_DIR" ]; then
            echo "🔧 Fixing execute permission on plugins directory: $PLUGINS_DIR"
            chmod g+x "$PLUGINS_DIR"
            if [ ! -x "$PLUGINS_DIR" ]; then
              echo "❌ Could not fix execute permission on $PLUGINS_DIR — try: sudo chmod g+x $PLUGINS_DIR"
              exit 1
            fi
          fi

          # Set sticky bit so new files inherit group
          chmod g+s "$PLUGINS_DIR"

          echo "✅ Plugins directory permissions OK"

          # Check and fix each plugin config directory and file
          for PLUGIN in corelife moralityengine; do
            CONFIG_DIR="${PLUGINS_DIR}/${CONFIG_DIRS[$PLUGIN]}"
            CONFIG_FILE="${CONFIG_DIR}/config.yml"

            if [ ! -d "$CONFIG_DIR" ]; then
              echo "⚠️  Config directory missing for ${PLUGIN}, creating: $CONFIG_DIR"
              mkdir -p "$CONFIG_DIR"
            fi

            if [ ! -w "$CONFIG_DIR" ]; then
              echo "🔧 Fixing write permission on config dir: $CONFIG_DIR"
              chmod g+w "$CONFIG_DIR"
              if [ ! -w "$CONFIG_DIR" ]; then
                echo "❌ Could not fix write permission on $CONFIG_DIR — try: sudo chmod g+w $CONFIG_DIR"
                exit 1
              fi
            fi

            echo "✅ Config directory writable for ${PLUGIN}"

            if [ -f "$CONFIG_FILE" ] && [ ! -w "$CONFIG_FILE" ]; then
              echo "🔧 Fixing write permission on config file: $CONFIG_FILE"
              chmod g+w "$CONFIG_FILE"
              if [ ! -w "$CONFIG_FILE" ]; then
                echo "❌ Could not fix write permission on $CONFIG_FILE — try: sudo chmod g+w $CONFIG_FILE"
                exit 1
              fi
            fi

            echo "✅ Config file writable for ${PLUGIN}"
          done

      - name: Backup and Deploy JARs
        run: |
          PLUGINS_DIR="/var/opt/minecraft/crafty/crafty-4/servers/${{ secrets.DEV_CRAFTY_SERVER_GUID }}/plugins"
          BACKUP_DIR="${PLUGINS_DIR}/backups/$(date +%Y%m%d%H%M%S)"
          mkdir -p "$BACKUP_DIR"
          for PLUGIN in corelife moralityengine; do
            EXISTING=$(find "${PLUGINS_DIR}" -maxdepth 1 -iname "${PLUGIN}*.jar" | head -n1)
            if [ -n "$EXISTING" ]; then
              mv "$EXISTING" "$BACKUP_DIR/"
            fi
            cp "artifacts/${PLUGIN}/"*.jar "${PLUGINS_DIR}/"
          done

      - name: Update Plugin Configs
        run: |
          PLUGINS_DIR="/var/opt/minecraft/crafty/crafty-4/servers/${{ secrets.DEV_CRAFTY_SERVER_GUID }}/plugins"
          declare -A CONFIG_DIRS=(
            [corelife]="CoreLife"
            [moralityengine]="MoralityEngine"
          )
          for PLUGIN in corelife moralityengine; do
            CONFIG_SRC="artifacts/${PLUGIN}-config/config.yml"
            CONFIG_DEST="${PLUGINS_DIR}/${CONFIG_DIRS[$PLUGIN]}/config.yml"
            if [ -f "$CONFIG_SRC" ]; then
              if [ -f "$CONFIG_DEST" ]; then
                echo "🔄 Replacing config for ${PLUGIN}: $CONFIG_DEST"
              else
                echo "🆕 Writing new config for ${PLUGIN}: $CONFIG_DEST"
              fi
              cp "$CONFIG_SRC" "$CONFIG_DEST"
            else
              echo "⚠️  No config found for ${PLUGIN} at $CONFIG_SRC — skipping"
            fi
          done

      - name: Restart Server
        run: |
          curl -sf -X POST "https://localhost:8443/api/v2/servers/${{ secrets.DEV_CRAFTY_SERVER_GUID }}/action/restart_server" \
            -H "Authorization: Bearer ${{ secrets.DEV_CRAFTY_TOKEN }}" \
            -k

      - name: Notify Discord
        if: always()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          ICON=$([ "${{ job.status }}" = "success" ] && echo "✅" || echo "❌")
          MSG="${ICON} **DEV** — \`all plugins\` | ${{ github.actor }} | [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) — ${COMMIT_MSG}"
          jq -n --arg content "$MSG" '{"content": $content}' | \
            curl -X POST "${DISCORD_WEBHOOK}" \
            -H "Content-Type: application/json" -d @-